  /api/v1/core/platform-audit-logs/:
    get:
      operationId: v1_core_platform_audit_logs_list
      description: |-
        Solo lectura (Especificacion de API §4.14) -se escribe unicamente via
        PlatformAuditLogService.log_action(), nunca por POST/PUT del cliente.

        Filtros manuales por query params en vez de django-filter (Sprint 8): el
        set de filtros es chico y fijo (staff/entidad/rango de fechas), no
        amerita sumar una dependencia nueva al proyecto solo para esto.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - platformBearerAuth: []
      - tenantBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatformAuditLogList'
          description: ''
