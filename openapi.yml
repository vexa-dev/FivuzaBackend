  /api/v1/core/legal/{document}/:
    get:
      operationId: v1_core_legal_retrieve
      description: |-
        GET /core/legal/terms/ o /core/legal/privacy/ (Sprint 33, Ley N
        29733) -sin autenticacion a proposito: cualquiera debe poder leer el
        texto vigente antes de aceptarlo.
      parameters:
      - in: path
        name: document
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - platformBearerAuth: []
      - tenantBearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
