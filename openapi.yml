components:
  schemas:
    ActionEnum:
      enum:
      - GRANTED
      - REVOKED
      type: string
      description: |-
        * `GRANTED` - GRANTED
        * `REVOKED` - REVOKED
    Attribute:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        values:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'
          readOnly: true
      required:
      - id
      - name
      - values
    AttributeValue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attribute:
          type: integer
        value:
          type: string
          maxLength: 100
      required:
      - attribute
      - id
      - value
    AuditLog:
      type: object
      description: |-
        Solo lectura -se escribe unicamente via AuditLogService.log_action(),
        nunca por POST/PUT directo del cliente.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
        entity_id:
          type: integer
          readOnly: true
        details:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - details
      - entity
      - entity_id
      - id
      - user
    BillingCycleEnum:
      enum:
      - MONTHLY
      - SEMIANNUAL
      - ANNUAL
      type: string
      description: |-
        * `MONTHLY` - MONTHLY
        * `SEMIANNUAL` - SEMIANNUAL
        * `ANNUAL` - ANNUAL
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
      required:
      - id
      - name
    CashMovement:
      type: object
      description: |-
        create() delega en CashSessionService.add_movement() en vez de
        insertar directamente -es el unico punto que valida que la sesion siga
        OPEN antes de aceptar un movimiento (Sprint 12, Infra/QA).
      properties:
        id:
          type: integer
          readOnly: true
        cash_session:
          type: integer
        type:
          $ref: '#/components/schemas/MovementDirectionEnum'
        concept:
          $ref: '#/components/schemas/CashMovementConceptEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        reason:
          type: string
        receipt_url:
          type: string
          format: uri
          nullable: true
          maxLength: 500
        user:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - cash_session
      - concept
      - created_at
      - id
      - type
      - user
    CashMovementConceptEnum:
      enum:
      - RETIRO
      - PAGO_PROVEEDOR_EFECTIVO
      - DEPOSITO_BANCO
      - AJUSTE
      - DEVOLUCION
      type: string
      description: |-
        * `RETIRO` - RETIRO
        * `PAGO_PROVEEDOR_EFECTIVO` - PAGO_PROVEEDOR_EFECTIVO
        * `DEPOSITO_BANCO` - DEPOSITO_BANCO
        * `AJUSTE` - AJUSTE
        * `DEVOLUCION` - DEVOLUCION
    CashRegister:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        warehouse:
          type: integer
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
      required:
      - id
      - name
      - warehouse
    CashSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cash_register:
          type: integer
        user:
          type: integer
          readOnly: true
        opening_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        opening_at:
          type: string
          format: date-time
          readOnly: true
        expected_closing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        counted_closing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CashSessionStatusEnum'
          readOnly: true
        closing_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 255
      required:
      - cash_register
      - closing_at
      - counted_closing_amount
      - difference
      - expected_closing_amount
      - id
      - opening_amount
      - opening_at
      - status
      - user
    CashSessionClose:
      type: object
      properties:
        counted_closing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        notes:
          type: string
      required:
      - counted_closing_amount
    CashSessionDetail:
      type: object
      description: |-
        Retrieve de una sesion incluye sus movimientos anidados -"detalle de
        una sesion cerrada con todos sus movimientos" (Especificacion de API
        §2.3), sin requerir una segunda llamada a /cash-movements/?cash_session=.
      properties:
        id:
          type: integer
          readOnly: true
        cash_register:
          type: integer
        user:
          type: integer
          readOnly: true
        opening_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        opening_at:
          type: string
          format: date-time
          readOnly: true
        expected_closing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        counted_closing_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/CashSessionStatusEnum'
          readOnly: true
        closing_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 255
        movements:
          type: array
          items:
            $ref: '#/components/schemas/CashMovement'
          readOnly: true
      required:
      - cash_register
      - closing_at
      - counted_closing_amount
      - difference
      - expected_closing_amount
      - id
      - movements
      - opening_amount
      - opening_at
      - status
      - user
    CashSessionOpen:
      type: object
      description: |-
        No es un ModelSerializer -delega la validacion de "una sola sesion
        abierta por caja" a CashSessionService.open_session(), igual que
        StockAdjustSerializer delega en StockService (Sprint 5).
      properties:
        cash_register_id:
          type: integer
        opening_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
      required:
      - cash_register_id
      - opening_amount
    CashSessionStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        primary_attribute:
          type: integer
          nullable: true
        allowed_attributes:
          type: array
          items:
            type: integer
      required:
      - id
      - name
    ClassBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        gym_class:
          type: integer
        class_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/ClassBookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - class_date
      - created_at
      - customer
      - gym_class
      - id
      - status
    ClassBookingCreate:
      type: object
      properties:
        customer_id:
          type: integer
        gym_class_id:
          type: integer
        class_date:
          type: string
          format: date
      required:
      - class_date
      - customer_id
      - gym_class_id
    ClassBookingStatusEnum:
      enum:
      - RESERVADO
      - ASISTIO
      - NO_ASISTIO
      - CANCELADO
      type: string
      description: |-
        * `RESERVADO` - RESERVADO
        * `ASISTIO` - ASISTIO
        * `NO_ASISTIO` - NO_ASISTIO
        * `CANCELADO` - CANCELADO
    ClassSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        gym_class:
          type: integer
        day_of_week:
          $ref: '#/components/schemas/DayOfWeekEnum'
        start_time:
          type: string
          format: time
        is_active:
          type: boolean
      required:
      - day_of_week
      - gym_class
      - id
      - start_time
    Customer:
      type: object
      description: |-
        current_debt/current_balance/oldest_unpaid_debt_at (Sprint 19) se
        calculan en cada serializacion -sin annotate/optimizar, mismo criterio
        que el resto del proyecto para catalogos de tamaño de negocio pequeño
        (Convenciones: no optimizar para una escala que todavia no existe).
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        document_number:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        credit_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        current_debt:
          type: string
          readOnly: true
        current_balance:
          type: string
          readOnly: true
        oldest_unpaid_debt_at:
          type: string
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - current_balance
      - current_debt
      - document_number
      - document_type
      - id
      - name
      - oldest_unpaid_debt_at
      - updated_at
    CustomerBalanceLedger:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        sale:
          type: integer
          readOnly: true
          nullable: true
        sale_return:
          type: integer
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/CustomerBalanceLedgerTypeEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - currency
      - customer
      - description
      - id
      - sale
      - sale_return
      - type
    CustomerBalanceLedgerTypeEnum:
      enum:
      - CREDIT
      - DEBIT
      type: string
      description: |-
        * `CREDIT` - CREDIT
        * `DEBIT` - DEBIT
    CustomerDebtLedger:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        sale:
          type: integer
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/CustomerDebtLedgerTypeEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
