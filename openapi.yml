          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - discount_percent
      - expires_at
      - id
      - override_price
      - reason
      - subscription_id
    SubscriptionPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        subscription:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        external_reference:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatusEnum'
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - payment_method
      - status
      - subscription
    SubscriptionPaymentStatusEnum:
      enum:
      - PAID
      - FAILED
      - REFUNDED
      - PENDING
      type: string
      description: |-
        * `PAID` - PAID
        * `FAILED` - FAILED
        * `REFUNDED` - REFUNDED
        * `PENDING` - PENDING
    SubscriptionStatusEnum:
      enum:
      - active
      - past_due
      - canceled
      type: string
      description: |-
        * `active` - active
        * `past_due` - past_due
        * `canceled` - canceled
    Supplier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ruc_or_dni:
          type: string
          maxLength: 20
        company_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 255
      required:
      - company_name
      - id
      - ruc_or_dni
    SyncStatusEnum:
      enum:
      - SYNCED
      - OFFLINE_PENDING
      - CONFLICT
      type: string
      description: |-
        * `SYNCED` - SYNCED
        * `OFFLINE_PENDING` - OFFLINE_PENDING
        * `CONFLICT` - CONFLICT
    TaxRate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - id
      - name
      - percentage
    Tenant:
      type: object
      description: |-
        Sin campo password/create: el registro de un tenant nuevo es un
        endpoint de accion propio (Especificacion de API §4.9), fuera del
        alcance de este CRUD (Sprint 1, tarea 5).
      properties:
        id:
          type: integer
          readOnly: true
        schema_name:
          type: string
          maxLength: 63
        company_name:
          type: string
          maxLength: 100
        ruc:
          type: string
          nullable: true
          maxLength: 20
        default_currency:
          type: string
          maxLength: 3
        status:
          allOf:
          - $ref: '#/components/schemas/TenantStatusEnum'
          readOnly: true
        suspended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        canceled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        provisioning_status:
          allOf:
          - $ref: '#/components/schemas/ProvisioningStatusEnum'
          readOnly: true
        created_on:
          type: string
          format: date
          readOnly: true
        domain:
          type: string
          nullable: true
          readOnly: true
      required:
      - canceled_at
      - company_name
      - created_on
      - domain
      - id
      - provisioning_status
      - schema_name
      - status
      - suspended_at
    TenantNote:
      type: object
      description: |-
        Solo lectura -se crea via TenantNoteService.add_note() en la vista,
        nunca aceptando tenant/platform_staff del payload del cliente.
      properties:
        id:
          type: integer
          readOnly: true
        tenant:
          type: integer
          readOnly: true
        platform_staff:
          type: object
          additionalProperties: {}
          readOnly: true
        text:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - platform_staff
      - tenant
      - text
    TenantRegister:
      type: object
      description: |-
        POST /api/v1/core/tenants/register/ (Especificacion de API §4.9).

        No es un ModelSerializer porque el payload combina campos de 3 modelos
        distintos (Tenant, Domain, Subscription) -delega la orquestacion a
        TenantRegistrationService.
      properties:
        company_name:
          type: string
          maxLength: 100
        ruc:
          type: string
          nullable: true
          maxLength: 20
        schema_name:
          type: string
          maxLength: 63
        domain:
          type: string
          maxLength: 253
        plan_code:
          type: string
        billing_cycle:
          $ref: '#/components/schemas/BillingCycleEnum'
        accept_terms:
          type: boolean
      required:
      - accept_terms
      - billing_cycle
      - company_name
      - domain
      - plan_code
      - schema_name
    TenantSettings:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tenant:
          type: integer
        purchases_enabled:
          type: boolean
        variants_enabled:
          type: boolean
        multi_warehouse_enabled:
          type: boolean
        hr_module_enabled:
          type: boolean
        cash_module_enabled:
          type: boolean
        cash_difference_alert_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        dashboard_refresh_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - tenant
      - updated_at
    TenantStatusEnum:
      enum:
      - active
      - trial
      - suspended
      - canceled
      type: string
      description: |-
        * `active` - Active
        * `trial` - Trial
        * `suspended` - Suspended
        * `canceled` - Canceled
    TenantUserTokenObtain:
      type: object
      description: |-
        Autentica un usuario del tenant (email/password) contra el esquema ya
        resuelto por TenantMainMiddleware y emite un par de tokens JWT con el
        claim schema_name embebido (API Spec §3.1).
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    UnitOfMeasureEnum:
      enum:
      - UND
      - KG
      type: string
      description: |-
        * `UND` - UND
        * `KG` - KG
    User:
      type: object
      description: |-
        password es write_only y se hashea con set_password(), nunca se
        guarda en texto plano (mismo patron que PlatformStaffCRUDSerializer).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: integer
        password:
          type: string
          writeOnly: true
        is_active:
          type: boolean
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        warehouse_ids:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
      required:
      - created_at
      - email
      - id
      - last_login
      - role
    UserPermission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        permission:
          type: integer
        is_granted:
          type: boolean
      required:
      - id
      - is_granted
      - permission
      - user
    UserWarehouse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        warehouse:
          type: integer
        warehouse_name:
          type: string
          readOnly: true
      required:
      - id
      - user
      - warehouse
      - warehouse_name
    VariantAttributeValue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attribute_value:
          type: integer
          readOnly: true
      required:
      - attribute_value
      - id
    VolumePricingTier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        variant:
          type: integer
        min_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
      required:
      - id
      - min_quantity
      - unit_price
      - variant
    Warehouse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    WidgetCodeEnum:
      enum:
      - SALES_TODAY
      - LOW_STOCK
      - CASH_STATUS
      - TOP_PRODUCTS
      - ATTENDANCE_TODAY
      type: string
      description: |-
        * `SALES_TODAY` - SALES_TODAY
        * `LOW_STOCK` - LOW_STOCK
        * `CASH_STATUS` - CASH_STATUS
        * `TOP_PRODUCTS` - TOP_PRODUCTS
        * `ATTENDANCE_TODAY` - ATTENDANCE_TODAY
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
