openapi: 3.0.3
info:
  title: Fivuza API
  version: 1.0.0
  description: API para el sistema SaaS Fivuza (ERP multi-tenant)
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        POST email/password de un usuario del tenant -> par de tokens JWT
        (API Spec §3.1). Resuelve el tenant por el subdominio de la request,
        ya procesado por TenantMainMiddleware antes de llegar aqui.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUserTokenObtain'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TenantUserTokenObtain'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TenantUserTokenObtain'
        required: true
      security:
      - platformBearerAuth: []
      - tenantBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUserTokenObtain'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: POST refresh token -> lo agrega a la blacklist, invalidandolo.
      tags:
      - v1
      security:
      - platformBearerAuth: []
      - tenantBearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        APIView con contrato base explícito para respuestas dinámicas.

        Las vistas con payload de entrada estable deben reemplazar
        ``serializer_class`` por su serializer de dominio. Los reportes que
        devuelven agregados calculados conservan este objeto abierto.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - platformBearerAuth: []
      - tenantBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
