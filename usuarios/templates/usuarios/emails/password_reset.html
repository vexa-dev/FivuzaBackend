<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Recupera tu contraseña de Fivuza</title>
  </head>
  <body style="font-family: -apple-system, 'Segoe UI', sans-serif; background: #E9EEF3; padding: 32px 0; margin: 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background: #FFFFFF; border-radius: 12px; padding: 32px;">
            <tr>
              <td>
                <h1 style="font-size: 20px; color: #0E202B; margin: 0 0 16px;">FIVUZA</h1>
                <p style="font-size: 14px; color: #3C4F5D; line-height: 1.6; margin: 0 0 20px;">
                  Recibimos una solicitud para restablecer tu contraseña. Si no fuiste tú, puedes ignorar este correo -tu contraseña actual sigue siendo válida.
                </p>
                <p style="text-align: center; margin: 0 0 20px;">
                  <a href="{{ reset_url }}" style="display: inline-block; background: #256E97; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 8px;">
                    Elegir nueva contraseña
                  </a>
                </p>
                <p style="font-size: 12px; color: #7C8D95; line-height: 1.5; margin: 0;">
                  Este enlace expira en 30 minutos. Si el botón no funciona, copia y pega esta URL en tu navegador:<br />
                  {{ reset_url }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
