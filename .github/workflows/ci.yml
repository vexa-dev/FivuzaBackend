name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Ruff
      # Version fija hasta el Sprint 6 (Plan de Implementacion, deuda
      # tecnica) mientras el proyecto no tenia un pyproject.toml propio -
      # una version nueva de Ruff podia cambiar reglas por defecto y romper
      # el CI sin aviso. Con la configuracion explicita en pyproject.toml
      # (target-version + ignore de RUF012), el comportamiento ya no
      # depende de que version se instale, asi que se libera a un piso
      # minimo en vez de un pin exacto.
      run: pip install "ruff>=0.15.21,<1.0"
    - name: Run Ruff Linter
      run: ruff check .
    - name: Run Ruff Formatter
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fivuza
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fivuza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://fivuza:password@localhost:5432/fivuza_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: python manage.py test
    - name: Django checks and pending migrations
      run: |
        python manage.py check
        python manage.py makemigrations --check --dry-run
    - name: Validate OpenAPI
      run: python manage.py spectacular --validate --fail-on-warn --file openapi.yml

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag fivuzabackend:test

  openapi-compat:
    # Sprint 32 (API Spec §1.1.1): recien a partir del feature freeze /v1/
    # empieza a acercarse a ser la promesa real que sera tras el lanzamiento,
    # asi que este gate se activa aqui y no antes. Solo corre en PRs -un
    # push directo a main no tiene "main" contra que compararse.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    services:
      # django-tenants exige el backend de Postgres -no alcanza con
      # cualquier DATABASE_URL, aunque este job nunca corre migraciones
      # de verdad (mismo servicio que el job "test" de arriba).
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fivuza
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fivuza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://fivuza:password@localhost:5432/fivuza_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
    - uses: actions/checkout@v7
      with:
        path: pr-branch
        fetch-depth: 0
    - uses: actions/checkout@v7
      with:
        ref: main
        path: main-branch
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install PR branch dependencies and generate its schema
      working-directory: pr-branch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py spectacular --validate --fail-on-warn --file ../schema_pr.yml
    - name: Install main branch dependencies and generate its schema
      working-directory: main-branch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # main es el baseline historico y todavia contiene advertencias de
        # inferencia. El PR se valida estrictamente arriba; aqui solo debemos
        # poder generar el contrato anterior para compararlo.
        python manage.py spectacular --validate --file ../schema_main.yml
    - name: Diff schemas for breaking changes
      working-directory: pr-branch
      run: >-
        python scripts/check_openapi_diff.py
        ../schema_main.yml ../schema_pr.yml openapi_breaking_changes.yml
