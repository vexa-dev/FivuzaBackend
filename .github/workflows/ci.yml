name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Ruff
      run: pip install ruff==0.15.21
    - name: Run Ruff Linter
      run: ruff check .
    - name: Run Ruff Formatter
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fivuza
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fivuza_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://fivuza:password@localhost:5432/fivuza_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag fivuzabackend:test
