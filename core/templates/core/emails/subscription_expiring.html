<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Tu suscripción a Fivuza vence pronto</title>
  </head>
  <body style="font-family: -apple-system, 'Segoe UI', sans-serif; background: #E9EEF3; padding: 32px 0; margin: 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background: #FFFFFF; border-radius: 12px; padding: 32px;">
            <tr>
              <td>
                <h1 style="font-size: 20px; color: #0E202B; margin: 0 0 16px;">FIVUZA</h1>
                <p style="font-size: 14px; color: #3C4F5D; line-height: 1.6; margin: 0 0 20px;">
                  La suscripción de <strong>{{ company_name }}</strong> vence el {{ expires_at }}. Confirma tu pago antes de esa fecha para evitar una interrupción del servicio.
                </p>
                <p style="font-size: 12px; color: #7C8D95; line-height: 1.5; margin: 0;">
                  Si ya realizaste la transferencia, ignora este correo -tu pago será confirmado por nuestro equipo en las próximas horas.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
