[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# RUF012 ("mutable default value for class attribute") asume el patron de
# dataclasses, donde un valor mutable compartido entre instancias es un bug
# real. En Django/DRF ese patron -Meta.fields=[...], Meta.constraints=[...],
# choices=[...], permission_classes=[...]- es la convencion estandar del
# framework: son literales de configuracion leidos una sola vez a nivel de
# clase, nunca mutados en runtime ni compartidos entre instancias. Activar
# esta regla aqui obligaria a reescribir ~137 sitios (Sprint 6, deuda
# tecnica) sin corregir ningun bug real, incluyendo migraciones que Django
# regenera solo y volveria a "romper" en la siguiente makemigrations.
ignore = ["RUF012"]
